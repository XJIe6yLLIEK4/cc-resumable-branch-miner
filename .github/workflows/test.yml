name: Lua 5.2 simulation tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python tests/run_tests.py
      - run: python -m unittest discover -s tests -p 'test_server_*.py'
